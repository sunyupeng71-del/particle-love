<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#080812" />
  <title>✦</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- 最底层：粒子 + 星空全在这里渲染 -->
  <canvas id="canvas"></canvas>

  <!-- 文字层（七句话；内容、定位、显隐全部由 script.js 控制） -->
  <div id="intro-wrap">
    <div id="intro-line1" class="intro-line"></div>
    <div id="intro-line2" class="intro-line"></div>
  </div>

  <!-- 声音开关（静音 / 取消静音；声音由首次触碰解锁） -->
  <button id="music-btn" aria-label="声音">♫</button>

  <!-- 隐藏签名 -->
  <footer id="page-footer">/* Built with love, for 范晓语. 2026 */</footer>

  <!-- Tone.js 由 script.js 在首次交互时动态注入，无需在此引入 -->
  <script src="script.js"></script>
</body>
</html>
